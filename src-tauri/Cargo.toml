[package]
name = "sagwan"
version = "0.1.0"
edition = "2024"

[lib]
name = "sagwan"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.16"
hound = "3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
thiserror = "2"
ureq = "2"
whisper-rs = "0.16"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
