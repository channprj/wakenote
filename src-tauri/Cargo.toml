[package]
name = "wakenote"
version = "0.260611.0"
edition = "2024"

[lib]
name = "wakenote"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.16"
hound = "3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
thiserror = "2"
ureq = "2"
whisper-rs = { version = "0.16", default-features = false }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
libc = "0.2"
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSError", "NSObject", "NSString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGWindow"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "objc2", "CMSampleBuffer", "CMBlockBuffer", "objc2-core-audio-types"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "SCStream", "SCShareableContent", "block2", "dispatch2", "libc", "objc2-core-media"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
whisper-rs = { version = "0.16", default-features = false, features = ["metal"] }
